# Docker Compose configuration for Data ETL Platform
# Updated for: Python 3.12, Spark 4.1.1, Airflow 2.10.4, JupyterLab 4.3

services:
  # PostgreSQL Database
  postgres:
    image: data-etl-postgres:latest
    container_name: data-etl-postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/docker-postgres/pg-init-scripts:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - etl-network

  # Apache Airflow Webserver
  airflow:
    image: data-etl-airflow:latest
    container_name: data-etl-airflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Airflow configuration
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      # Security keys - 從 .env 檔案讀取或使用預設值
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-olDpdQh84IPSamGzX3HuJQ==}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-olDpdQh84IPSamGzX3HuJQ==}
      # Spark connection
      SPARK_HOME: /usr/local/spark
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./spark/app:/opt/airflow/spark/app
      - ./spark/jars:/opt/airflow/spark/jars
      - ./data:/opt/airflow/data
      - ./requirements.txt:/opt/airflow/requirements.txt
      - ./docker/docker-airflow/config/airflow.cfg:/opt/airflow/airflow.cfg
      - ./docker/docker-airflow/scripts/entrypoint.sh:/entrypoint.sh
      # Mount /home/workspace for compatibility with Spark paths
      - ./data:/home/workspace/data
      - ./spark/app:/home/workspace/app
      - ./spark/jars:/home/workspace/jars
    ports:
      - "8282:8080"
    command: webserver
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - etl-network

  # Apache Airflow Scheduler
  airflow-scheduler:
    image: data-etl-airflow:latest
    container_name: data-etl-airflow-scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Airflow configuration
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      # Security keys - 從 .env 檔案讀取或使用預設值
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-olDpdQh84IPSamGzX3HuJQ==}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-olDpdQh84IPSamGzX3HuJQ==}
      # Spark connection
      SPARK_HOME: /usr/local/spark
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./spark/app:/opt/airflow/spark/app
      - ./spark/jars:/opt/airflow/spark/jars
      - ./data:/opt/airflow/data
      - ./requirements.txt:/opt/airflow/requirements.txt
      - ./docker/docker-airflow/config/airflow.cfg:/opt/airflow/airflow.cfg
      - ./docker/docker-airflow/scripts/entrypoint.sh:/entrypoint.sh
      # Mount /home/workspace for compatibility with Spark paths
      - ./data:/home/workspace/data
      - ./spark/app:/home/workspace/app
      - ./spark/jars:/home/workspace/jars
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $${HOSTNAME}"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 60s
    networks:
      - etl-network

  # Spark Master
  spark-master:
    image: data-etl-spark-master:latest
    container_name: data-etl-spark-master
    restart: unless-stopped
    user: root
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
    volumes:
      - ./spark/app:/home/workspace/app
      - ./spark/jars:/home/workspace/jars
      - ./spark/conf:/home/workspace/conf
      - ./data:/home/workspace/data
    ports:
      - "8080:8080"  # Spark Master Web UI
      - "7077:7077"  # Spark Master Port
      - "6066:6066"  # Spark Master REST Port
    networks:
      - etl-network

  # Spark Worker 1
  spark-worker-1:
    image: data-etl-spark-worker:latest
    container_name: data-etl-spark-worker-1
    restart: unless-stopped
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_WEBUI_PORT: 8081
      PYSPARK_PYTHON: /app/.venv/bin/python3.12
      PYSPARK_DRIVER_PYTHON: /app/.venv/bin/python3.12
      PYTHONPATH: /app/.venv/lib/python3.12/site-packages
    volumes:
      - ./spark/app:/home/workspace/app
      - ./spark/jars:/home/workspace/jars
      - ./data:/home/workspace/data
    ports:
      - "8081:8081"  # Worker 1 Web UI
    networks:
      - etl-network

  # Spark Worker 2
  spark-worker-2:
    image: data-etl-spark-worker:latest
    container_name: data-etl-spark-worker-2
    restart: unless-stopped
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_WEBUI_PORT: 8081
      PYSPARK_PYTHON: /app/.venv/bin/python3.12
      PYSPARK_DRIVER_PYTHON: /app/.venv/bin/python3.12
      PYTHONPATH: /app/.venv/lib/python3.12/site-packages
    volumes:
      - ./spark/app:/home/workspace/app
      - ./spark/jars:/home/workspace/jars
      - ./data:/home/workspace/data
    ports:
      - "8082:8081"  # Worker 2 Web UI
    networks:
      - etl-network

  # Spark Worker 3
  spark-worker-3:
    image: data-etl-spark-worker:latest
    container_name: data-etl-spark-worker-3
    restart: unless-stopped
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_WEBUI_PORT: 8081
      PYSPARK_PYTHON: /app/.venv/bin/python3.12
      PYSPARK_DRIVER_PYTHON: /app/.venv/bin/python3.12
      PYTHONPATH: /app/.venv/lib/python3.12/site-packages
    volumes:
      - ./spark/app:/home/workspace/app
      - ./spark/jars:/home/workspace/jars
      - ./data:/home/workspace/data
    ports:
      - "8083:8081"  # Worker 3 Web UI
    networks:
      - etl-network

  # JupyterLab
  jupyterlab:
    image: data-etl-notebook:latest
    container_name: data-etl-jupyterlab
    restart: unless-stopped
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      # Spark configuration
      SPARK_MASTER: spark://spark-master:7077
    volumes:
      - ./notebooks:/home/jovyan/work/notebooks
      - ./data:/home/jovyan/work/data
      - ./spark/app:/home/jovyan/work/spark
      - ./dags:/home/jovyan/work/dags
    ports:
      - "8888:8888"  # JupyterLab
      - "4040:4040"  # Spark Application UI
    networks:
      - etl-network

# Named volumes for persistent data
volumes:
  postgres_data:
    name: data-etl-postgres-data

# Network for service communication
networks:
  etl-network:
    name: data-etl-network
    driver: bridge
