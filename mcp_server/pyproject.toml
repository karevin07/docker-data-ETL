[project]
name = "etl-observability-mcp"
version = "0.1.0"
description = "MCP server that lets an agent answer 'why didn't this table update today?' against the docker-data-etl stack"
authors = [{ name = "Kelvin Liao" }]
license = { text = "MIT" }
requires-python = ">=3.10"

dependencies = [
    "mcp>=2.0,<3",
    "psycopg2-binary>=2.9.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
etl-mcp = "etl_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["etl_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
