[project]
name = "docker-data-etl"
version = "0.2.0"
description = "A lightweight ETL platform with Airflow, Spark, and PostgreSQL"
authors = [{ name = "Kelvin Liao" }]
license = { text = "MIT" }
# readme = "README.md"  # Commented out for Docker builds
requires-python = ">=3.12,<4.0"

dependencies = [
    # Updated dependencies with security patches
    "celery==5.4.0",
    "kombu==5.4.2",
    "tornado==6.4.2",
    "werkzeug==3.1.3",
    "sqlalchemy==1.4.54",  # Keep 1.4.x for Airflow 2.10.x compatibility
    "jieba==0.42.1",
    "requests==2.32.3",
    "beautifulsoup4==4.12.3",
    "lxml==5.3.0",
    "pyspark==3.5.4",  # Compatible with Spark 4.1.1 (PySpark 4.x not yet stable)
    "pandas>=2.2.0,<3.0.0",
    "numpy>=2.1.0,<3.0.0",
    "psycopg2-binary==2.9.10",
    "redis==5.2.1",
    "pytz==2025.1",
    # Security: explicitly pin safe versions
    "setuptools>=75.6.0",  # CVE fixes
    "urllib3>=2.6.3",      # Security patches
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "black>=26.3.1",
    "flake8>=7.1.0,<8.0.0",
    "mypy>=1.13.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
