[tool.poetry]
name = "docker-data-etl"
version = "0.2.0"
description = "A lightweight ETL platform with Airflow, Spark, and PostgreSQL"
authors = ["Kelvin Liao"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
# Updated dependencies with security patches
celery = "5.4.0"
kombu = "5.4.2"
tornado = "6.4.2"
werkzeug = "3.1.3"
sqlalchemy = "1.4.54"  # Keep 1.4.x for Airflow 2.10.x compatibility
jieba = "0.42.1"
requests = "2.32.3"
beautifulsoup4 = "4.12.3"
lxml = "5.3.0"
pyspark = "3.5.4"  # Compatible with Spark 4.1.1 (PySpark 4.x not yet stable)
pandas = "^2.2.0"
numpy = "^2.1.0"
psycopg2-binary = "2.9.10"
redis = "5.2.1"
pytz = "2025.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
black = "^24.10.0"
flake8 = "^7.1.0"
mypy = "^1.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
