[project]
name = "docker-data-etl"
version = "0.2.0"
description = "A lightweight ETL platform with Airflow, Spark, and PostgreSQL"
authors = [{ name = "Kelvin Liao" }]
license = { text = "MIT" }
# readme = "README.md"  # Commented out for Docker builds
requires-python = ">=3.12,<4.0"

# This lock feeds docker-base only (uv sync --frozen --no-dev), which is the
# runtime for the Spark cluster. Spark jobs (spark/app/*.py) import just
# pyspark, pandas and jieba. Airflow and the crawler run in their own images
# with their own requirements, so their deps do not belong here.
dependencies = [
    "pyspark==3.5.3",  # matches Airflow 2.10.4 constraints; cluster runs Spark 4.1.3 via spark-submit
    "pandas>=2.2.0,<3.0.0",
    "jieba==0.42.1",
]

[project.optional-dependencies]
# Crawler deps for running/testing the Extract stage locally (not in any image).
# Airflow itself is not listed here on purpose - install it separately with the
# official constraints file so its large dependency tree stays out of uv.lock.
dags = [
    "requests>=2.33.0",   # CVE-2024-47081 + PYSEC-2026-2275
    "beautifulsoup4>=4.12.3",
    "lxml>=6.1.0",
]
dev = [
    "pytest>=9.0.3",       # PYSEC-2026-1845
    "black>=26.3.1",
    "flake8>=7.1.0,<8.0.0",
    "mypy>=1.13.0,<2.0.0",
    "click>=8.3.3",        # transitive (black); PYSEC-2026-2132
    "pygments>=2.20.0",    # transitive (pytest); PYSEC-2026-2987
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
