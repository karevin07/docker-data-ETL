version: "3.7"
services:  
    postgres:
        image: data-etl-postgres
        volumes:
            - ./docker/docker-postgres/pg-init-scripts:/docker-entrypoint-initdb.d
        environment:
            - POSTGRES_USER=airflow
            - POSTGRES_PASSWORD=airflow
            - POSTGRES_DB=airflow
        ports:
            - "5432:5432"

    scheduler:
        image: data-etl-airflow
        deploy:
            restart_policy:
                condition: on-failure
        command: ["bash", "-c", "airflow db init && airflow users create -r Admin -u admin -e admin@example.com -f admin -l user -p admin && airflow scheduler"]
        depends_on:
            postgres:
                condition: service_started
        volumes:
            - ./docker/docker-airflow/config/airflow.cfg:/usr/local/airflow/airflow.cfg
            - ./dags:/usr/local/airflow/dags
            - ./spark/app:/home/workspace/app
            - ./spark/jars:/home/workspace/jars
            - ./data:/home/workspace/data
        healthcheck:
            test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s

    airflow-web:
        image: data-etl-airflow
        restart: on-failure
        depends_on:
            scheduler:
                condition: service_healthy
        environment:
            - LOAD_EX=n
            - EXECUTOR=Local
        logging:
            options:
                max-size: 10m
                max-file: "3"
        volumes:
            - ./docker/docker-airflow/config/airflow.cfg:/usr/local/airflow/airflow.cfg
            - ./dags:/usr/local/airflow/dags
            - ./spark/app:/home/workspace/app
            - ./spark/jars:/home/workspace/jars
            - ./data:/home/workspace/data
        ports:
            - "8282:8080"
        command: ["bash", "-c", "airflow webserver"]
        healthcheck:
            test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
            interval: 30s
            timeout: 30s
            retries: 3
            
    # Spark with 3 workers
    spark:
        image: data-etl-spark-master
        user: root
        environment:
            - SPARK_MODE=master
        volumes:
            - ./spark/app:/home/workspace/app
            - ./spark/jars:/home/workspace/jars
            - ./data:/home/workspace/data
        ports:
            - "8080:8080"
            - "7077:7077"

    spark-worker-1:
        image: data-etl-spark-worker
        depends_on:
            - spark
        environment:
            - SPARK_MASTER_URL=spark://spark:7077
            - SPARK_WORKER_MEMORY=1G
            - SPARK_WORKER_CORES=1
        ports:
            - "8081:8081"
        volumes:
            - ./spark/app:/home/workspace/app
            - ./spark/jars:/home/workspace/jars
            - ./spark/conf/spark-env.sh:/usr/bin/spark-3.2.1-bin-hadoop3.2/conf/spark-env.sh

    spark-worker-2:
        image: data-etl-spark-worker
        depends_on:
            - spark
        environment:
            - SPARK_MASTER_URL=spark://spark:7077
            - SPARK_WORKER_MEMORY=1G
            - SPARK_WORKER_CORES=1
        ports:
            - "8082:8081"
        volumes:
            - ./spark/app:/home/workspace/app
            - ./spark/jars:/home/workspace/jars
            - ./spark/conf/spark-env.sh:/usr/bin/spark-3.2.1-bin-hadoop3.2/conf/spark-env.sh

    spark-worker-3:
        image: data-etl-spark-worker
        depends_on:
            - spark
        environment:
            - SPARK_MASTER_URL=spark://spark:7077
            - SPARK_WORKER_MEMORY=1G
            - SPARK_WORKER_CORES=1
        ports:
            - "8083:8081"
        volumes:
            - ./spark/app:/home/workspace/app
            - ./spark/jars:/home/workspace/jars
            - ./spark/conf/spark-env.sh:/usr/bin/spark-3.2.1-bin-hadoop3.2/conf/spark-env.sh

    jupyterlab:
        image: data-etl-notebook
        ports:
            - 8888:8888
            - 4040:4040
        volumes:
            - ./notebooks:/home/workspace/notebooks
            - ./spark:/home/workspace/spark
            - ./data:/home/workspace/data